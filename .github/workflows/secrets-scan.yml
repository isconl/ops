# Drop this in as .github/workflows/secrets-scan.yml in any repo produced by the
# isconl-agent split. Runs on every push and PR, regardless of which machine or
# Claude/human account made the commit -- enforcement lives in the repo, not in
# any one session's discipline.
name: secrets-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history available locally, so any log-opts range below always resolves
      # NOT gitleaks/gitleaks-action@v2 -- that wraps the CLI in a hosted
      # dashboard integration that requires a paid GITLEAKS_LICENSE for any
      # GitHub *organization* repo (isconl is an org), and fails outright
      # without one ("[isconl] is an organization. License key is
      # required."), regardless of whether the code is clean. The gitleaks
      # CLI itself is free/open-source (AGPL) with no such gate -- installed
      # and run directly here, sidestepping the Action's license wall
      # entirely while keeping identical detection.
      - name: gitleaks
        env:
          EVT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          VERSION=$(curl -sSf https://api.github.com/repos/gitleaks/gitleaks/releases/latest 2>/dev/null | grep -m1 '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks

          if [ "$EVT_NAME" = "pull_request" ]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            RANGE="-1"
          fi

          ./gitleaks detect --source . --log-opts="$RANGE" --redact -v --exit-code 1

  identity-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded identity markers
        run: |
          PATTERN='sconl@proton\.me'
          if grep -rIniE "$PATTERN" --exclude-dir=.git --exclude-dir=node_modules --exclude=secrets-scan.yml .; then
            echo "::error::Hardcoded personal identifier found -- see matches above. This repo is meant to be tenant-agnostic; move this to config/vault, never source."
            exit 1
          fi
